name: FreeCAD Copr release pipeline

on:
  schedule:
    - cron: '30 12 * * *'
      timezone: Europe/Brussels
    - cron: '30 17 * * *'
      timezone: Europe/Brussels
  workflow_dispatch:
    inputs:
      force_tag:
        description: Optional upstream release tag to validate and process
        required: false
        type: string
      force_channel:
        description: Channel to use with force_tag
        required: false
        default: auto
        type: choice
        options: [auto, stable, candidate]
  repository_dispatch:
    types: [freecad-release]

concurrency:
  group: freecad-release-packaging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      manifest: ${{ steps.detect.outputs.manifest }}
      native_matrix: ${{ steps.detect.outputs.native_matrix }}
      native_package_matrix: ${{ steps.detect.outputs.native_package_matrix }}
      non_native_matrix: ${{ steps.detect.outputs.non_native_matrix }}
      non_native_package_matrix: ${{ steps.detect.outputs.non_native_package_matrix }}
      has_native: ${{ steps.detect.outputs.has_native }}
      has_non_native: ${{ steps.detect.outputs.has_non_native }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Resolve eligible releases
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_TAG: ${{ github.event.inputs.force_tag || github.event.client_payload.tag || '' }}
          FORCE_CHANNEL: ${{ github.event.inputs.force_channel || 'auto' }}
        run: python scripts/detect_release.py --force-tag "$FORCE_TAG" --force-channel "$FORCE_CHANNEL"

  static-checks:
    needs: detect
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install static validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm shellcheck
          python -m pip install --upgrade PyYAML
          actionlint_version=1.7.12
          curl -fsSLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_linux_amd64.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
      - name: Validate workflow and repository metadata
        run: |
          actionlint .github/workflows/build-rpm.yml
          python -c 'import json, pathlib, yaml; json.load(open("config/release-policy.json")); [yaml.safe_load(p.read_text()) for p in pathlib.Path(".github/workflows").glob("*.yml")]'
          python -m compileall -q scripts tests
          shellcheck scripts/*.sh
      - name: Validate Python behavior and RPM spec profiles
        run: |
          sudo apt-get install -y rpm
          python -m unittest discover -s tests -v

  build-native-srpm:
    needs: [detect, static-checks]
    if: needs.detect.outputs.has_native == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.native_package_matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install source RPM and security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam rpm
      - name: Check out exact upstream source tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: FreeCAD/FreeCAD
          ref: ${{ matrix.tag }}
          path: upstream
          fetch-depth: 0
          submodules: recursive
      - name: Scan upstream source and packaging inputs
        run: |
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          python scripts/scan_native_source.py \
            --source upstream \
            --package '${{ matrix.package }}' \
            --report native-security-report.json
      - name: Build reproducible native SRPM
        env:
          PRERELEASE: ${{ matrix.prerelease }}
        run: |
          set -- \
            --source upstream \
            --package '${{ matrix.package }}' \
            --version '${{ matrix.version }}' \
            --release '${{ matrix.release }}' \
            --output-dir SRPMS
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          python scripts/build_native_srpm.py "$@"
          clamscan --infected SRPMS/*.src.rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-srpm-${{ matrix.package }}
          path: SRPMS/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-report-native-${{ matrix.package }}
          path: |
            native-security-report.json
            native-security-reports/
          if-no-files-found: warn
          retention-days: 30

  build-payload:
    needs: [detect, static-checks]
    if: needs.detect.outputs.has_non_native == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.non_native_matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install extraction and security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clamav clamav-freshclam file rpm rpm2cpio squashfs-tools zstd
      - name: Download and verify selected upstream artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_URL: ${{ matrix.url }}
          ASSET_NAME: ${{ matrix.name }}
          ASSET_ARCH: ${{ matrix.architecture }}
          ASSET_FORMAT: ${{ matrix.format }}
          ASSET_DIGEST: ${{ matrix.digest || '' }}
          CHECKSUM_URL: ${{ matrix.checksum_url || '' }}
        run: |
          python scripts/fetch_asset.py \
            --url "$ASSET_URL" \
            --filename "$ASSET_NAME" \
            --architecture "$ASSET_ARCH" \
            --format "$ASSET_FORMAT" \
            --digest "$ASSET_DIGEST" \
            --checksum-url "$CHECKSUM_URL"
      - name: Extract without executing upstream code
        run: |
          python scripts/normalize_payload.py \
            --asset-manifest "dist/${{ matrix.architecture }}/verified-asset.json" \
            --package '${{ matrix.package }}' \
            --architecture '${{ matrix.architecture }}' \
            --output-root payload
      - name: Scan original artifact and normalized payload
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          python scripts/security_scan.py \
            --original "dist/${{ matrix.architecture }}/${{ matrix.name }}" \
            --payload "payload/${{ matrix.package }}/${{ matrix.architecture }}" \
            --package '${{ matrix.package }}' \
            --architecture '${{ matrix.architecture }}' \
            --report security-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: payload-${{ matrix.package }}-${{ matrix.architecture }}
          path: payload/${{ matrix.package }}/${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-report-${{ matrix.package }}-${{ matrix.architecture }}
          path: |
            security-report.json
            security-reports/
          if-no-files-found: warn
          retention-days: 30

  build-nonnative-srpm:
    needs: [detect, static-checks, build-payload]
    if: needs.detect.outputs.has_non_native == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.non_native_package_matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payload-${{ matrix.package }}-x86_64
          path: payload/${{ matrix.package }}/x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payload-${{ matrix.package }}-aarch64
          path: payload/${{ matrix.package }}/aarch64
      - name: Build non-native SRPM from verified payloads
        run: |
          python scripts/build_non_native_srpm.py \
            --package '${{ matrix.package }}' \
            --version '${{ matrix.version }}' \
            --release '${{ matrix.release }}' \
            --payload-root payload \
            --output-dir SRPMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nonnative-srpm-${{ matrix.package }}
          path: SRPMS/*
          if-no-files-found: error
          retention-days: 14

  submit-native:
    needs: [detect, static-checks, build-native-srpm]
    if: needs.detect.outputs.has_native == 'true'
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.native_package_matrix) }}
    timeout-minutes: 350
    steps:
      - name: Prepare the container for JavaScript actions
        run: dnf -y install nodejs git tar gzip
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Copr client
        run: dnf -y install copr-cli python3 python3-rpm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-srpm-${{ matrix.package }}
          path: SRPMS
      - name: Submit and monitor all configured Copr chroots
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          test -n "$COPR_CONFIG"
          install -d -m 0700 "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 0600 "$HOME/.config/copr"
          SRPM=$(find SRPMS -maxdepth 1 -type f -name '*.src.rpm' -print -quit)
          test -n "$SRPM"
          python3 scripts/submit_copr.py \
            --srpm "$SRPM" \
            --package '${{ matrix.package }}' \
            --output "build-results/${{ matrix.package }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: copr-result-${{ matrix.package }}
          path: build-results/
          if-no-files-found: warn
          retention-days: 30

  submit-nonnative:
    needs: [detect, static-checks, build-nonnative-srpm]
    if: needs.detect.outputs.has_non_native == 'true'
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.non_native_package_matrix) }}
    timeout-minutes: 350
    steps:
      - name: Prepare the container for JavaScript actions
        run: dnf -y install nodejs git tar gzip
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Copr client
        run: dnf -y install copr-cli python3 python3-rpm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nonnative-srpm-${{ matrix.package }}
          path: SRPMS
      - name: Submit and monitor all configured Copr chroots
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          test -n "$COPR_CONFIG"
          install -d -m 0700 "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 0600 "$HOME/.config/copr"
          SRPM=$(find SRPMS -maxdepth 1 -type f -name '*.src.rpm' -print -quit)
          test -n "$SRPM"
          python3 scripts/submit_copr.py \
            --srpm "$SRPM" \
            --package '${{ matrix.package }}' \
            --output "build-results/${{ matrix.package }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: copr-result-${{ matrix.package }}
          path: build-results/
          if-no-files-found: warn
          retention-days: 30

  finalize-state:
    needs: [detect, static-checks, build-payload, build-nonnative-srpm, build-native-srpm, submit-native, submit-nonnative]
    if: >-
      always() &&
      needs.detect.outputs.has_changes == 'true' &&
      needs.static-checks.result == 'success' &&
      (needs.detect.outputs.has_native != 'true' || needs.submit-native.result == 'success') &&
      (needs.detect.outputs.has_non_native != 'true' || needs.submit-nonnative.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download successful Copr build records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: copr-result-*
          path: build-results
          merge-multiple: false
      - name: Download SRPM metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-srpm-*'
          path: build-metadata
          merge-multiple: true
      - name: Download payload provenance and security reports
        if: needs.detect.outputs.has_non_native == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: payload-*
          path: payloads
          merge-multiple: false
      - name: Download security reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: security-report-*
          path: security-reports
          merge-multiple: false
      - name: Finalize state after every Copr target succeeded
        env:
          RELEASE_MANIFEST: ${{ needs.detect.outputs.manifest }}
        run: python scripts/update_state.py
      - name: Commit successful release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state/*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record successful FreeCAD Copr builds"
          git push origin "HEAD:${GITHUB_REF_NAME}"
