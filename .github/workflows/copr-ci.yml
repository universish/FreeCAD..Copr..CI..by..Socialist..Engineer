name: FreeCAD Fedora Copr CI

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * *'
      timezone: Europe/Brussels
    - cron: '30 17 * * *'
      timezone: Europe/Brussels
  workflow_dispatch:
    inputs:
      force_version:
        description: 'FreeCAD source release tag to package'
        required: false
        default: ''
      force_channel:
        description: 'Release channel'
        type: choice
        options: [auto, stable, candidate]
        default: auto
  repository_dispatch:
    types: [freecad-upstream-release, freecad-healthcheck]

concurrency:
  group: freecad-copr-pipeline
  cancel-in-progress: false

env:
  COPR_PROJECT: universish/FreeCAD..

jobs:
  # =========================================================================
  # AŞAMA 1: Tespit ve Statik Kontroller
  # =========================================================================
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      pkg: ${{ steps.detect.outputs.pkg }}
      release: ${{ steps.detect.outputs.release }}
      html_url: ${{ steps.detect.outputs.html_url }}
      native_changed: ${{ steps.detect.outputs.native_changed }}
      non_native_changed: ${{ steps.detect.outputs.non_native_changed }}
      native_matrix: ${{ steps.detect.outputs.native_matrix }}
      non_native_matrix: ${{ steps.detect.outputs.non_native_matrix }}
      payload_matrix: ${{ steps.detect.outputs.payload_matrix }}
      stable_enabled: ${{ steps.detect.outputs.stable_enabled }}
      candidate_enabled: ${{ steps.detect.outputs.candidate_enabled }}
      stable_tag: ${{ steps.detect.outputs.stable_tag }}
      stable_version: ${{ steps.detect.outputs.stable_version }}
      stable_html_url: ${{ steps.detect.outputs.stable_html_url }}
      stable_native_changed: ${{ steps.detect.outputs.stable_native_changed }}
      stable_native_release: ${{ steps.detect.outputs.stable_native_release }}
      stable_non_native_changed: ${{ steps.detect.outputs.stable_non_native_changed }}
      stable_non_native_release: ${{ steps.detect.outputs.stable_non_native_release }}
      candidate_tag: ${{ steps.detect.outputs.candidate_tag }}
      candidate_version: ${{ steps.detect.outputs.candidate_version }}
      candidate_html_url: ${{ steps.detect.outputs.candidate_html_url }}
      candidate_native_changed: ${{ steps.detect.outputs.candidate_native_changed }}
      candidate_native_release: ${{ steps.detect.outputs.candidate_native_release }}
      candidate_non_native_changed: ${{ steps.detect.outputs.candidate_non_native_changed }}
      candidate_non_native_release: ${{ steps.detect.outputs.candidate_non_native_release }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq curl
      - id: detect
        env:
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
          FORCE_CHANNEL: ${{ github.event.inputs.force_channel }}
        run: ./scripts/detect-release.sh

  static-checks:
    runs-on: ubuntu-latest
    name: Shell, workflow, spec, and source-input checks
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y rpm python3-yaml
      - name: Validate scripts, workflow YAML, specs, and native patches
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -c 'import yaml; yaml.safe_load(open(".github/workflows/copr-ci.yml", encoding="utf-8"))'
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          for spec in freecad.spec freecad-candidate.spec freecad-non-native.spec freecad-candidate-non-native.spec; do
            sed -e 's/@VERSION@/1.2.3/g' -e 's/@RELEASE@/1/g' "$spec" > "$tmpdir/$spec"
            rpmspec -P "$tmpdir/$spec" >/dev/null
          done
          test -s patches/0001-fix-nlohmann-json-include.patch
          test -s patches/0002-find-external-e57format.patch
          test "$(grep -Ev '^[[:space:]]*(#|$)' chroots.txt | wc -l)" -eq 14

  # =========================================================================
  # AŞAMA 2: Payload Doğrulama ve Tarama (4 Adet: Stable/Candidate x x86_64/aarch64)
  # =========================================================================
  build-payload:
    needs: [detect, static-checks]
    if: needs.detect.outputs.non_native_changed == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.detect.outputs.payload_matrix) }}
    runs-on: ${{ matrix.runner }}
    name: Verify and scan ${{ matrix.channel }} ${{ matrix.arch }} payload
    env:
      ARCH: ${{ matrix.arch }}
      PKG: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction and scan tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl rpm cpio binutils squashfs-tools zstd clamav clamav-freshclam desktop-file-utils
      - name: Fetch and verify upstream release asset
        id: fetch
        env:
          ASSET_URL: ${{ matrix.url }}
          ASSET_FORMAT: ${{ matrix.format }}
          CHECKSUM_URL: ${{ matrix.checksum_url }}
          API_DIGEST: ${{ matrix.digest }}
        run: ./scripts/fetch-and-verify.sh
      - name: Extract and normalize payload
        env:
          ASSET_FORMAT: ${{ matrix.format }}
          FILENAME: ${{ steps.fetch.outputs.filename }}
        run: ./scripts/repackage.sh
      - name: Scan payload before artifact upload
        env:
          TARGET: payload/${{ matrix.arch }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: ./scripts/security-scan.sh
      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.channel }}-${{ matrix.arch }}
          path: payload/${{ matrix.arch }}/
          retention-days: 7

  # =========================================================================
  # AŞAMA 3: Source SRPM Oluşturma (Native ve Non-Native)
  # =========================================================================
  source-srpm:
    needs: [detect, static-checks] # Native build, payload'a ihtiyaç duymaz, bağımsız çalışabilir.
    if: needs.detect.outputs.native_changed == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.detect.outputs.native_matrix) }}
    runs-on: ubuntu-latest
    name: Native source SRPM (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4
      
      # DEBUG: Native matrisinin gerçekten 2 öğe (stable, candidate) içerip içermediğini kontrol et
      - name: Debug Native Matrix
        run: |
          echo "Native Matrix İçeriği:"
          echo '${{ toJSON(needs.detect.outputs.native_matrix) }}' | jq .

      - name: Fetch the matching FreeCAD source and initialized submodules
        uses: actions/checkout@v4
        with:
          repository: FreeCAD/FreeCAD
          ref: ${{ matrix.tag }}
          path: upstream
          submodules: recursive
          fetch-depth: 0
      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm clamav clamav-freshclam
      - name: Update ClamAV signatures and scan native source
        run: |
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          sudo freshclam --stdout
          sudo clamscan --recursive --infected --no-summary upstream
      - name: Create native source RPM
        env:
          PKG: ${{ matrix.pkg }}
          VERSION: ${{ matrix.version }}
          RELEASE: ${{ matrix.release }}
          FREECAD_SOURCE_DIR: upstream
        run: ./scripts/build-srpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: srpm-native-${{ matrix.channel }}
          path: SRPMS/*.src.rpm
          retention-days: 14

  source-srpm-non-native:
    needs: [detect, static-checks, build-payload] # build-payload bitmeden bu çalışamaz!
    if: needs.detect.outputs.non_native_changed == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.detect.outputs.non_native_matrix) }}
    runs-on: ubuntu-latest
    name: Non-native SRPM (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4

      # DEBUG: Hangi artifact'lerin indirilmeye çalışıldığını göster
      - name: Debug Non-Native Matrix & Expected Artifacts
        run: |
          echo "Beklenen x86_64 Artifact: payload-${{ matrix.channel }}-x86_64"
          echo "Beklenen aarch64 Artifact: payload-${{ matrix.channel }}-aarch64"

      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ matrix.channel }}-x86_64
          path: payload
        continue-on-error: true # Eğer upstream x86_64 yayınlamadıysa job'ı kırma, kontrol et

      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ matrix.channel }}-aarch64
          path: payload
        continue-on-error: true

      - name: Debug payload layout (Non-Native)
        run: |
          echo "=== İNDİRİLEN PAYLOAD DİZİN YAPISI ==="
          find payload -maxdepth 4 -printf '%M %p\n' | sort || echo "payload dizini boş veya yok"
          
          echo "=== x86_64 KONTROLÜ ==="
          if [[ -f "payload/x86_64/AppRun" ]]; then
            echo "BAŞARILI: payload/x86_64/AppRun bulundu!"
          else
            echo "HATA: payload/x86_64/AppRun bulunamadı. (Upstream bu mimariyi yayınlamamış veya build-payload başarısız olmuş olabilir)"
          fi

      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Create non-native source RPM
        env:
          PKG: ${{ matrix.pkg }}
          VERSION: ${{ matrix.version }}
          RELEASE: ${{ matrix.release }}
          PAYLOAD_ROOT: payload
        run: |
          # Her iki mimari için de çalıştırma iznini garantiye al
          for arch in x86_64 aarch64; do
            if [[ -f "payload/$arch/AppRun" ]]; then
              chmod +x "payload/$arch/AppRun"
              echo "payload/$arch/AppRun çalıştırma izni güncellendi."
            fi
          done
          
          ./scripts/build-srpm-non-native.sh

      - uses: actions/upload-artifact@v4
        with:
          name: srpm-non-native-${{ matrix.channel }}
          path: SRPMS/*.src.rpm
          retention-days: 14

  # =========================================================================
  # AŞAMA 4: Copr'a Gönderim
  # =========================================================================
  copr:
    needs: [detect, source-srpm]
    if: needs.detect.outputs.native_changed == 'true'
    runs-on: ubuntu-latest
    name: Submit native SRPMs to Copr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: srpm-native-*
          path: SRPMS
          merge-multiple: true
      - name: Install Copr CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv
          python3 -m venv "$RUNNER_TEMP/copr-cli"
          "$RUNNER_TEMP/copr-cli/bin/pip" install copr-cli
          echo "$RUNNER_TEMP/copr-cli/bin" >> "$GITHUB_PATH"
      - name: Configure Copr credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
      - name: Submit native SRPMs with NVR idempotency checks
        run: ./scripts/submit-copr.sh SRPMS/*.src.rpm

  copr-non-native:
    needs: [detect, source-srpm-non-native]
    if: needs.detect.outputs.non_native_changed == 'true'
    runs-on: ubuntu-latest
    name: Submit non-native SRPMs to Copr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: srpm-non-native-*
          path: SRPMS
          merge-multiple: true
      - name: Install Copr CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv
          python3 -m venv "$RUNNER_TEMP/copr-cli"
          "$RUNNER_TEMP/copr-cli/bin/pip" install copr-cli
          echo "$RUNNER_TEMP/copr-cli/bin" >> "$GITHUB_PATH"
      - name: Configure Copr credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
      - name: Submit non-native SRPMs with NVR idempotency checks
        run: ./scripts/submit-copr.sh SRPMS/*.src.rpm

  # =========================================================================
  # AŞAMA 5: Finalize (Durum Güncelleme)
  # =========================================================================
  finalize:
    needs: [detect, copr, copr-non-native]
    if: >-
      always() && needs.detect.result == 'success' &&
      needs.detect.outputs.changed == 'true' &&
      (needs.detect.outputs.native_changed != 'true' || needs.copr.result == 'success') &&
      (needs.detect.outputs.non_native_changed != 'true' || needs['copr-non-native'].result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update per-package state after Copr submissions
        env:
          NATIVE_MATRIX: ${{ needs.detect.outputs.native_matrix }}
          NON_NATIVE_MATRIX: ${{ needs.detect.outputs.non_native_matrix }}
        run: |
          while IFS= read -r item; do
            PKG=$(jq -r '.pkg' <<< "$item")
            VERSION=$(jq -r '.version' <<< "$item")
            RELEASE=$(jq -r '.release' <<< "$item")
            HTML_URL=$(jq -r '.html_url' <<< "$item")
            jq -n --arg v "$VERSION" --argjson r "$RELEASE" --arg u "$HTML_URL" \
              '{version:$v, release:$r, packaging_mode: "native-source", upstream_url:$u, updated_at:(now|strftime("%Y-%m-%dT%H:%M:%SZ"))}' > "state/$PKG.json"
          done < <(jq -c '.include[]?' <<< "$NATIVE_MATRIX")
          
          while IFS= read -r item; do
            PKG=$(jq -r '.pkg' <<< "$item")
            VERSION=$(jq -r '.version' <<< "$item")
            RELEASE=$(jq -r '.release' <<< "$item")
            HTML_URL=$(jq -r '.html_url' <<< "$item")
            X86_URL=$(jq -r '.x86_64_url' <<< "$item")
            X86_FORMAT=$(jq -r '.x86_64_format' <<< "$item")
            X86_DIGEST=$(jq -r '.x86_64_digest' <<< "$item")
            ARM_URL=$(jq -r '.aarch64_url' <<< "$item")
            ARM_FORMAT=$(jq -r '.aarch64_format' <<< "$item")
            ARM_DIGEST=$(jq -r '.aarch64_digest' <<< "$item")
            jq -n --arg v "$VERSION" --argjson r "$RELEASE" --arg u "$HTML_URL" \
              --arg xu "$X86_URL" --arg xf "$X86_FORMAT" --arg xd "$X86_DIGEST" \
              --arg au "$ARM_URL" --arg af "$ARM_FORMAT" --arg ad "$ARM_DIGEST" \
              '{version:$v, release:$r, packaging_mode: "non-native", upstream_url:$u,
              assets:{x86_64:{url:$xu,format:$xf,digest:$xd},aarch64:{url:$au,format:$af,digest:$ad}},
              updated_at:(now|strftime("%Y-%m-%dT%H:%M:%SZ"))}' > "state/$PKG.json"
          done < <(jq -c '.include[]?' <<< "$NON_NATIVE_MATRIX")
          
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/*.json
          git commit -m 'ci: update FreeCAD package state [skip ci]' || true
          git pull --rebase --autostash origin main
          git push
