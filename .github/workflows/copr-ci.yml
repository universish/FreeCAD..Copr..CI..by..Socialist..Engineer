name: FreeCAD Fedora Copr CI

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 11 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'FreeCAD source release tag to package'
        required: false
        default: ''
      force_channel:
        description: 'Release channel'
        type: choice
        options: [auto, stable, candidate]
        default: auto
  repository_dispatch:
    types: [freecad-upstream-release, freecad-healthcheck]

concurrency:
  group: freecad-copr-pipeline
  cancel-in-progress: false

env:
  COPR_PROJECT: universish/FreeCAD..

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      pkg: ${{ steps.detect.outputs.pkg }}
      non_native_pkg: ${{ steps.detect.outputs.non_native_pkg }}
      appimage_url: ${{ steps.detect.outputs.appimage_url }}
      release: ${{ steps.detect.outputs.release }}
      html_url: ${{ steps.detect.outputs.html_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq curl
      - id: detect
        env:
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
          FORCE_CHANNEL: ${{ github.event.inputs.force_channel }}
        run: ./scripts/detect-release.sh

  source-srpm:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the matching FreeCAD source and initialized submodules
        uses: actions/checkout@v4
        with:
          repository: FreeCAD/FreeCAD
          ref: ${{ needs.detect.outputs.tag }}
          path: upstream
          submodules: recursive
          fetch-depth: 0
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Create native source RPM
        env:
          PKG: ${{ needs.detect.outputs.pkg }}
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE: ${{ needs.detect.outputs.release }}
          FREECAD_SOURCE_DIR: upstream
        run: ./scripts/build-srpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: srpm
          path: SRPMS/*.src.rpm
          retention-days: 14

  source-srpm-non-native:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm wget
      - name: Create non-native AppImage SRPM
        env:
          PKG: ${{ needs.detect.outputs.non_native_pkg }}
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE: ${{ needs.detect.outputs.release }}
          APPIMAGE_URL: ${{ needs.detect.outputs.appimage_url }}
        run: |
          # The corrected AppImage specs are suffixed -1 to distinguish them
          # from the older native payload specs with the same package names.
          cp "${PKG}-1.spec" "${PKG}.spec"
          ./scripts/build-srpm-non-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: srpm-non-native
          path: SRPMS/*.src.rpm
          retention-days: 14

  copr:
    needs: [detect, source-srpm]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: srpm
          path: SRPMS
      - name: Install Copr CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv
          python3 -m venv "$RUNNER_TEMP/copr-cli"
          "$RUNNER_TEMP/copr-cli/bin/pip" install copr-cli
          echo "$RUNNER_TEMP/copr-cli/bin" >> "$GITHUB_PATH"
      - name: Configure Copr credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
      - name: Build only on Fedora chroots
        run: |
          mapfile -t wanted < <(grep -Ev '^[[:space:]]*(#|$)' chroots.txt)
          copr-cli list-chroots > /tmp/valid-chroots.txt
          args=()
          for chroot in "${wanted[@]}"; do
            grep -qx "$chroot" /tmp/valid-chroots.txt || {
              echo "::error::Configured Fedora chroot is unavailable: $chroot"
              exit 1
            }
            args+=(-r "$chroot")
          done
          copr-cli build --timeout 21600 "${args[@]}" \
            "$COPR_PROJECT" SRPMS/*.src.rpm

  copr-non-native:
    needs: [detect, source-srpm-non-native]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: srpm-non-native
          path: SRPMS
      - name: Install Copr CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv
          python3 -m venv "$RUNNER_TEMP/copr-cli"
          "$RUNNER_TEMP/copr-cli/bin/pip" install copr-cli
          echo "$RUNNER_TEMP/copr-cli/bin" >> "$GITHUB_PATH"
      - name: Configure Copr credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
      - name: Build non-native AppImage RPM for x86_64 chroots
        run: |
          mapfile -t wanted < <(grep -E '^[[:alnum:]-]+-x86_64$' chroots.txt)
          copr-cli list-chroots > /tmp/valid-chroots.txt
          args=()
          for chroot in "${wanted[@]}"; do
            if grep -qx "$chroot" /tmp/valid-chroots.txt; then
              args+=(-r "$chroot")
            else
              echo "::warning::Configured x86_64 chroot is unavailable: $chroot"
            fi
          done
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::error::No configured x86_64 Copr chroots are available."
            exit 1
          fi
          copr-cli build --nowait --timeout 21600 "${args[@]}" \
            "$COPR_PROJECT" SRPMS/*.src.rpm

  finalize:
    needs: [detect, copr, copr-non-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update packaged source version
        env:
          PKG: ${{ needs.detect.outputs.pkg }}
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE: ${{ needs.detect.outputs.release }}
          HTML_URL: ${{ needs.detect.outputs.html_url }}
        run: |
          jq -n --arg v "$VERSION" --argjson r "$RELEASE" --arg u "$HTML_URL" \
            '{version:$v, release:$r, packaging_mode:"native-source", upstream_url:$u, updated_at:(now|strftime("%Y-%m-%dT%H:%M:%SZ"))}' \
            > "state/$PKG.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "state/$PKG.json"
          git commit -m "ci: package $PKG $VERSION-$RELEASE [skip ci]" || true
          git pull --rebase --autostash origin main
          git push
